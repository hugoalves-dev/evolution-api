name: Verify RabbitMQ Publisher Confirms

on:
  push:
    branches:
      - fix/rabbitmq-publisher-confirms
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-confirm-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test RabbitMQ behavior
        env:
          TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
        run: npx tsx --test test/*.test.ts

      - name: Generate Prisma client
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Build
        run: npm run build
