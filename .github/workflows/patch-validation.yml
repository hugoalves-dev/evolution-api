name: RabbitMQ publisher confirms
on:
  push:
    branches:
      - fix/rabbitmq-publisher-confirms
  pull_request:
    branches:
      - main

jobs:
  verify-confirm-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx --test test/rabbitmq-publish-confirmed.test.ts
      - run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql
      - run: npm run build
